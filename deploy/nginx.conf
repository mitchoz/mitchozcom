# nginx config for www.mitchoz.com (a static site, see ../Dockerfile).
# Coolify's proxy terminates HTTPS in front of this container and forwards plain HTTP on port 80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative (/jobsandai/ rather than http://host:80/jobsandai/), so they keep https behind the proxy.
    absolute_redirect off;
    server_tokens off;

    charset utf-8;
    charset_types text/html text/css text/plain text/markdown application/javascript application/json image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Pages, styles, scripts, tweets and the agent files change without new names: always check for a newer version.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    # The site as Markdown, for agents (built by tools/build_md.py).
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Images, audio and icons rarely change: let browsers keep them for a month.
    location ~ ^/(assets|thumbs)/|^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|og-image\.png)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Old site: files under /public/ now live in /assets/ (large JPEG/PNG images became .webp).
    location ~ ^/public/(?<file>.+?)(?<ext>\.[A-Za-z0-9]+)$ {
        if (-f $document_root/assets/$file$ext) { return 301 /assets/$file$ext; }
        if (-f $document_root/assets/$file.webp) { return 301 /assets/$file.webp; }
        return 404;
    }

    # Keep the build tools' leftovers private, should any end up in the image.
    location ~ /\. { return 404; }
}
