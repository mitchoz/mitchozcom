# nginx config for www.mitchoz.com (a static site, see ../Dockerfile).
# Coolify's proxy terminates HTTPS in front of this container and forwards plain HTTP on port 80.

# mitchoz.com without www: one address for search engines.
server {
    listen 80;
    server_name mitchoz.com;
    return 301 https://www.mitchoz.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.mitchoz.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative (/jobsandai/ rather than http://host:80/jobsandai/), so they keep https behind the proxy.
    absolute_redirect off;
    server_tokens off;

    charset utf-8;
    charset_types text/html text/css text/plain text/markdown text/xml application/xml application/javascript application/json image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/markdown text/xml application/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Pages, styles, scripts, lore and the agent files change without new names: always check for a newer version.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/index.html =404;
    }

    # The old site's addresses had no trailing slash (/jobsandai): send them, and any folder, to /jobsandai/ for good.
    location ~ ^/(?<folder>[A-Za-z0-9_-]+)$ {
        if (-d $document_root/$folder) { return 301 /$folder/; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The old site's homepage files.
    location = /index.php { return 301 /; }
    location = /index.html { return 301 /; }

    # The site as Markdown, for agents (built by tools/build_md.py).
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Images, audio and icons rarely change: let browsers keep them for a month.
    location ~ ^/(assets|thumbs|press/photos|press/previews|press/logo)/|^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-(192|512)\.png|og-image\.png)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Old site: files under /public/ now live in /assets/ (large JPEG/PNG images became .webp).
    location ~ ^/public/(?<file>.+?)(?<ext>\.[A-Za-z0-9]+)$ {
        if (-f $document_root/assets/$file$ext) { return 301 /assets/$file$ext; }
        if (-f $document_root/assets/$file.webp) { return 301 /assets/$file.webp; }
        return 404;
    }

    # Keep the build tools' leftovers private, should any end up in the image.
    location ~ /\. { return 404; }
}
